  font-family:var(--body);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#ground{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(120% 70% at 50% -10%,rgba(226,160,60,.10),transparent 60%),
    radial-gradient(90% 60% at 18% 110%,rgba(47,110,99,.22),transparent 65%),
    linear-gradient(180deg,#0B1420 0%,#0E1822 55%,#080F17 100%)}
#stage{position:relative;width:390px;height:844px;transform-origin:center center;flex:0 0 auto}
#phone{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);
  border:1px solid #050B12;box-shadow:0 0 0 5px #101B26,0 0 0 6px #050B12,0 26px 60px rgba(0,0,0,.6)}
#phone:after{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:120px 120px;
  opacity:.035;pointer-events:none;z-index:30;mix-blend-mode:multiply}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.dsp{font-family:var(--disp);font-weight:600;letter-spacing:-.1px}
.kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

/* ---------- the shift header: ink slab, cream figures ---------- */
.strip{flex:0 0 auto;position:relative;padding:11px 12px 10px;color:var(--paper);
  background:linear-gradient(160deg,#17293A 0%,#13202C 58%,#0F1A25 100%);
  border-bottom:2px solid #050B12}
.strip:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--amber) 0%,rgba(226,160,60,.15) 62%,transparent 100%)}
.slots{display:flex;gap:7px}
.slot{flex:1;min-width:0;text-align:left;background:rgba(242,231,211,.055);
  border:1px solid rgba(242,231,211,.14);border-radius:4px;padding:5px 8px 6px}
.slot .k{display:block;font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  color:#B6A890;font-weight:600}
.slot b{display:block;font-size:26px;line-height:1.02;color:#EAE4D7;font-weight:600;
  font-family:var(--body);letter-spacing:-.5px}
.slot b.gilt{color:var(--amber-l)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:7px;
  font-size:11px;line-height:1.25;color:#B7A88F;letter-spacing:.05em}
.meta b{color:#EAE4D7;font-weight:600}
.load{flex:0 0 auto;margin-top:8px;height:16px;background:rgba(242,231,211,.08);
  border:1px solid rgba(242,231,211,.16);border-radius:2px;position:relative;overflow:hidden}
.load i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-l));
  transform-origin:left center;transition:transform .3s ease}
.load.hot i{background:linear-gradient(90deg,var(--amber-d),var(--amber))}
.load .lab{position:absolute;right:6px;top:0;line-height:14px;font-size:10px;letter-spacing:.14em;
  color:#EAE4D7;font-weight:600}

/* ---------- act band on paper ---------- */
.prompt{flex:0 0 auto;padding:9px 13px 10px;background:var(--paper);
  border-bottom:1px solid var(--edge2);position:relative}
.prompt .pr{display:flex;align-items:baseline;gap:8px}
.prompt .act{font-size:10px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;color:#8E2C1C}
.prompt .ttl{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
.prompt p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.prompt p b{color:var(--ink);font-weight:600}

/* ---------- the board ---------- */
.wardwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:8px 9px 6px;gap:6px;overflow:hidden;
  background:
    linear-gradient(180deg,rgba(19,32,44,.16),transparent 22%),
    radial-gradient(74% 58% at 50% 46%,#39485A 0%,#1B2630 100%)}
#wardart{display:block;filter:drop-shadow(0 10px 16px rgba(3,8,13,.55))}
.plan{box-shadow:0 0 0 1px #050B12,0 0 0 7px #101B26,0 0 0 8px #050B12}
.plan{position:relative;flex:0 0 auto}
.hot{position:absolute;inset:0}
.hot button{position:absolute;background:none;border:2px solid transparent;border-radius:3px;
  transition:border-color .15s ease,background .15s ease}
.hot button:hover{border-color:rgba(184,122,34,.55)}
.hot button:focus-visible{border-color:var(--amber);background:rgba(226,160,60,.16)}
.hot button.lit{border-color:var(--amber);background:rgba(226,160,60,.18)}
.legend{display:flex;gap:5px;padding:0 1px 1px;width:100%}
.legend div{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:10px;line-height:1.15;
  color:#F0E6D3;font-weight:600;letter-spacing:.01em}
.legend svg{flex:0 0 19px;width:19px;height:19px}

/* ---------- the bar: paper tickets on the ink shelf ---------- */
.bar{flex:0 0 auto;display:flex;gap:6px;padding:9px 10px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#13202C,#0C1620);border-top:2px solid #050B12}
.bar button{min-height:56px;border-radius:5px;background:var(--card);border:1px solid var(--edge2);
  box-shadow:0 2px 0 rgba(5,11,18,.55),inset 0 1px 0 #fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:5px 3px;font-size:11px;font-weight:600;
  color:var(--ink2);letter-spacing:.03em;text-align:center;line-height:1.1}
.bar button svg{width:21px;height:21px;display:block}
.bar #b-main{flex:1 1 46%;background:linear-gradient(180deg,#DFA753,#D68F2C);border-color:var(--amber-d);color:#221403;
  font-weight:600;font-size:14px;font-family:var(--disp);letter-spacing:0}
.bar #b-main svg{width:19px;height:19px}
.bar button:active{transform:translateY(1px)}
.bar .nb{flex:1 1 18%}
.bar button.hold{filter:saturate(.6) brightness(.94)}

/* ---------- sheets ---------- */
#veil{position:absolute;left:0;right:0;bottom:0;top:118px;background:rgba(11,20,30,.55);
  opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:8}
#veil.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:78%;display:flex;flex-direction:column;
  background:var(--paper);border-top:3px solid var(--ink);border-radius:14px 14px 0 0;
  box-shadow:0 -14px 34px rgba(5,11,18,.45);opacity:0;visibility:hidden;min-height:44%;
  transition:opacity .18s ease,visibility 0s linear .18s}
.sheet.on{opacity:1;visibility:visible;transition:opacity .18s ease}
.sheet .hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 13px 9px;
  border-bottom:1px solid var(--edge2)}
.sheet .hd h2{margin:0;font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-.2px;
  flex:1;min-width:0;color:var(--ink)}
.sheet .hd .sub{font-size:11px;color:var(--muted)}
.sheet .bd{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:11px 13px 15px;
  display:flex;flex-direction:column;gap:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sheet .bd::-webkit-scrollbar{display:none}
.sheet .bd>*{flex:0 0 auto}
.x{flex:0 0 44px;width:44px;height:44px;border-radius:5px;background:var(--card);
  border:1px solid var(--edge2);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.x svg{width:18px;height:18px}

/* cards read as index cards on the ward desk */
.card{background:var(--card);border:1px solid var(--edge);border-left:4px solid var(--teal);
  border-radius:4px;padding:9px 10px 10px;box-shadow:0 1px 0 rgba(19,32,44,.06)}
.card.want{border-left-color:var(--amber);background:#E7DDCB}
.card h3{margin:0 0 5px;font-family:var(--disp);font-size:15px;font-weight:600;color:var(--ink)}
.card .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .r1 b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.card p{margin:5px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.card p b{color:var(--ink)}
.card .tag{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--teal);color:#E7DDCB;border-radius:2px;padding:3px 6px;margin-top:6px;font-weight:700}
.card .tag.need{background:var(--amber);color:#221403}
.card .tag.block{background:var(--red);color:#ECE1DC}
.card .tag.ok{background:var(--teal-wash);color:var(--teal-d)}
.card button,.wide{display:block;width:100%;min-height:46px;margin-top:8px;border-radius:4px;
  background:linear-gradient(180deg,#357669,#2A6157);color:#E7DDCB;border:1px solid var(--teal-d);
  font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:6px 8px;line-height:1.25}
.card button.alt,.wide.alt{background:var(--card);color:var(--ink);border:1px solid var(--edge2)}
.card button.gilt{background:linear-gradient(180deg,#DFA753,#D68F2C);color:#221403;border-color:var(--amber-d)}
.card button.warnx{background:linear-gradient(180deg,#C2523C,#A83A26);color:#ECE1DC;border-color:#8A2C1B}
.rowline{display:flex;gap:6px}
.rowline button{flex:1 1 0;margin-top:8px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.sorts{display:flex;gap:6px}
.sorts button{flex:1 1 0;min-height:44px;border-radius:4px;border:1px solid var(--edge2);
  background:var(--card);font-size:11.5px;color:var(--ink2);font-weight:600}
.sorts button.on{background:var(--teal);color:#E7DDCB;border-color:var(--teal-d)}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-height:44px;border-radius:4px;border:1px solid var(--edge2);
  background:var(--card);font-size:11.5px;color:var(--ink2)}
.seg button.on{background:var(--teal);color:#E7DDCB;border-color:var(--teal-d)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;
  padding:6px 10px;background:var(--card);border:1px solid var(--edge);border-radius:4px;text-align:left}
.sw b{font-size:13px;font-weight:600;display:block;color:var(--ink)}
.sw span{font-size:11.5px;color:var(--muted);display:block;margin-top:1px;line-height:1.35}
.pill{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.09em;border-radius:10px;
  padding:4px 9px;background:#D9CDB7;color:var(--ink2);border:1px solid var(--edge2)}
.pill.on{background:var(--teal);color:#E7DDCB;border-color:var(--teal-d)}
.pill.gilt{background:var(--amber);color:#221403;border-color:var(--amber-d)}
.wline{background:var(--card);border:1px solid var(--edge);border-radius:4px;padding:8px 10px}
.wline b{font-family:var(--disp);font-size:13.5px;font-weight:600}
.wline p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.wline .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mini{display:flex;gap:8px;align-items:center}
.mini svg{flex:0 0 40px;width:40px;height:40px}

/* ---------- the call card ---------- */
#md-call{position:absolute;inset:0;z-index:12;display:flex;align-items:flex-end;justify-content:center;
  padding:0 0 96px;background:rgba(11,20,30,.58);opacity:0;visibility:hidden;
  transition:opacity .18s ease,visibility 0s linear .18s}
#md-call.on{opacity:1;visibility:visible;transition:opacity .18s ease}
#md-call .box{width:100%;max-width:366px;background:var(--paper);border-top:3px solid var(--red);
  border-radius:12px;padding:13px 13px 15px;transform:translateY(14px);transition:transform .2s ease;
  box-shadow:0 -12px 30px rgba(5,11,18,.5)}
#md-call.on .box{transform:translateY(0)}
#md-call .who{display:flex;gap:9px;align-items:center}
#md-call .who svg{flex:0 0 48px;width:48px;height:48px}
#md-call h2{margin:0;font-family:var(--disp);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
#md-call .sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
#md-call p{margin:9px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
#md-call button{display:block;width:100%;min-height:54px;margin-top:8px;border-radius:5px;
  border:1px solid var(--edge2);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;
  padding:7px 10px;line-height:1.25;text-align:left}
#md-call button.gilt{background:linear-gradient(180deg,#DFA753,#D68F2C);color:#221403;border-color:var(--amber-d)}
#md-call button span{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px;line-height:1.3}
.gbody{position:absolute;left:0;right:0;bottom:0;top:0;overflow:hidden}
#phone.nomotion .sheet,#phone.nomotion #md-call,#phone.nomotion #md-call .box{transition:none}
#phone.nomotion .load i{transition:none}
.slot{text-align:left}

</style>
</head>
<body>
<div id="ground"><div id="stage"><div id="phone">

  <div class="strip">
    <div class="slots">
      <div class="slot"><span class="k">Cash</span><b id="s-cash" class="num">0</b></div>
      <button class="slot" data-a="door" aria-label="Open the ward door and the queue"><span class="k">Queue</span><b id="s-queue" class="num">0</b></button>
      <div class="slot"><span class="k" id="s-thirdk">Load</span><b id="s-third" class="num">0</b></div>
    </div>
    <div class="meta"><span id="s-place">Bay Four</span><span id="s-day">Day 1</span><span id="s-grade">Grade new</span></div>
    <div class="load" id="s-loadwrap"><i id="s-loadfill"></i><span class="lab" id="s-loadlab">LOAD 0</span></div>
  </div>

  <div class="prompt">
    <div class="pr"><span class="act" id="p-act">Act 1</span><span class="ttl" id="p-title">The door</span></div>
    <p id="p-line">The ward is open.</p>
  </div>

  <div class="wardwrap" id="wardwrap">
    <div class="plan" id="plan">
    <svg id="wardart" viewBox="0 0 374 452" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="A cutaway plan of the ward, corridor between six room slots"></svg>
    <div class="hot" id="hot"></div>
    </div>
    <div class="legend" id="legend">
      <div><svg viewBox="0 0 22 22"><rect x="1" y="4" width="20" height="14" rx="2" fill="#E7DDCB" stroke="#13202C" stroke-width="1.2"/><path d="M4 15h14v-4c0-1-1-1.6-2-1.6H8V7.4C8 6.4 7 5.8 6 5.8S4 6.4 4 7.4z" fill="#2F6E63"/><rect x="4.6" y="12" width="4.6" height="2.2" fill="#85B3A6"/></svg><span>Working</span></div>
      <div><svg viewBox="0 0 22 22"><rect x="1" y="4" width="20" height="14" rx="2" fill="#E7DDCB" stroke="#13202C" stroke-width="1.2"/><circle cx="11" cy="11" r="4.6" fill="none" stroke="#B87A22" stroke-width="1.8"/><path d="M7.6 14.4l6.8-6.8" stroke="#B87A22" stroke-width="1.8"/></svg><span>Waiting</span></div>
      <div><svg viewBox="0 0 22 22"><rect x="1" y="4" width="20" height="14" rx="2" fill="#DACDB7" stroke="#13202C" stroke-width="1.2"/><path d="M3 11h16M3 13.6h16" stroke="#3B4A44" stroke-width="2.6" stroke-dasharray="3 2"/></svg><span>Blocked</span></div>
      <div><svg viewBox="0 0 22 22"><rect x="1" y="4" width="20" height="14" rx="2" fill="#ECE7DC" stroke="#BFAE90" stroke-width="1.2" stroke-dasharray="3 2"/></svg><span>Empty</span></div>
    </div>
  </div>

  <div class="bar">
    <button id="b-main" class="dsp">Walk the round</button>
    <button id="b-build" class="nb" data-a="build"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="9" height="5" fill="#2F6E63"/><rect x="3" y="12" width="13" height="5" fill="#85B3A6"/><rect x="12.6" y="6" width="8.4" height="5" fill="#1F5148"/></svg>Build</button>
    <button id="b-roster" class="nb" data-a="roster"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.4" r="3.6" fill="#2F6E63"/><path d="M4.6 20c0-4.2 3.3-7 7.4-7s7.4 2.8 7.4 7z" fill="#85B3A6"/></svg>Roster</button>
    <button id="b-chain" class="nb" data-a="chain"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" fill="#2F6E63"/><rect x="12" y="8" width="7" height="12" fill="#85B3A6"/><rect x="12" y="4" width="7" height="3" fill="#E2A03C"/></svg>Chain</button>
  </div>

  <div id="veil" data-a="close"></div>

  <div class="sheet" id="sh-room" role="dialog" aria-label="Room card"></div>
  <div class="sheet" id="sh-patient" role="dialog" aria-label="Patient card"></div>
  <div class="sheet" id="sh-build" role="dialog" aria-label="Build sheet"></div>
  <div class="sheet" id="sh-staff" role="dialog" aria-label="Staff panel"></div>
  <div class="sheet" id="sh-report" role="dialog" aria-label="Shift report"></div>
  <div class="sheet" id="sh-choice" role="dialog" aria-label="Choice"></div>
  <div class="sheet" id="sh-chain" role="dialog" aria-label="The chain"></div>

  <div id="md-call" role="dialog" data-a="callLater" aria-label="The staff raise a problem"><div class="box" id="md-body"></div></div>

</div></div></div>
<script>
/* ============================================================
   WARD WATCH 1.0
   1. THE CONTENT. Rooms, invented conditions, staff, moods.
   Every condition here is invented, every treatment is designed
   backwards from it, and no real disease is ever named.
   ============================================================ */
var ROMS=[
 {id:"triage",n:"Triage",cost:900,door:110,kit:0,beds:0,role:"nurse",
  does:"sorts the queue into a seen-in order the ward then follows"},
 {id:"bay",n:"Bay",cost:1200,door:120,kit:0,beds:2,role:"",
  does:"beds where patients wait, and the card-swap problem"},
 {id:"treat",n:"Treatment room",cost:1800,door:70,kit:90,beds:1,role:"nurse",

 {id:"day",n:"Day room",cost:700,door:120,kit:0,beds:0,role:"",

 {id:"store",n:"Store",cost:600,door:70,kit:0,beds:0,role:"",
  does:"holds the kit, and the kit that will not fit through a door"},
 {id:"staff",n:"Staff room",cost:800,door:100,kit:0,beds:0,role:"",
  does:"where staff recover off the floor, and the report is written from"},
 {id:"office",n:"Office",cost:1000,door:100,kit:0,beds:0,role:"admin",
  does:"the books, the standing grade and the register"},
 {id:"lounge",n:"Discharge lounge",cost:650,door:120,kit:0,beds:3,role:"",
  does:"where patients wait to go home, and a bay comes free sooner"},
 {id:"coat",n:"Coat room",cost:820,door:100,kit:0,beds:0,role:"",
  does:"dries the damp hats on a rail over a radiator, and pays better for that case"}
];
var CONDS=[
 {n:"Soggy Elbow",room:"day",pay:120,
  joke:"arrives with one sleeve wrung out. A mop, a chair and a firm talk."},
 {n:"Reversible Enthusiasm",room:"day",pay:110,
  joke:"delighted about everything, including the queue. A sober room and a firm chair."},
 {n:"Mild Levitation",room:"bay",pay:150,
  joke:"hovers a hand's width above the bed. A weighted blanket and a sensible talk."},
 {n:"Spontaneous Fanfare",room:"treat",pay:210,
  joke:"arrives accompanied by a small noise. A quiet room and a signed form."},
 {n:"Persistent Punctuality",room:"office",pay:180,
  joke:"early for everything, including their own discharge. An appointment card and a slow clock."},
 {n:"Inkling Knee",room:"treat",pay:230,
  joke:"the knee has a suspicion the patient does not. A second opinion from a porter."},
 {n:"Damp Hat",room:"store",pay:140,
  joke:"the hat will not dry and it is not the weather. A radiator and a hat stand."}
];
var FIRSTS=["Ada","Bram","Cleo","Dara","Ellis","Fen","Greta","Hal","Ines","Jory","Kit","Lorna",
 "Mira","Nell","Osric","Pip","Quinn","Rosa","Sim","Tessa","Una","Viggo","Wren","Yara"];
var LASTS=["Ashcroft","Bell","Cornwall","Dunne","Enders","Fairlie","Gorse","Hollis","Ives","Jerrow",
 "Kell","Lund","Mabb","Norcott","Oyra","Pember","Quill","Rask","Sowden","Tarn","Underhill","Vane"];
var ROLES=["porter","nurse","senior nurse","doctor","consultant","administrator"];
var TRAITS=["kind","hopeless with numbers","brilliant","frightened of the equipment","brisk","thorough",
 "forgetful","deft","stubborn","unhurried","popular","methodical"];
var MOODS={
 Steady:{w:"Steady",eff:"nothing",speed:1,err:1,post:"up"},
 Brisk:{w:"Brisk",eff:"faster, and fewer errors",speed:1.4,err:.6,post:"lean"},
 Flat:{w:"Flat",eff:"slower",speed:.6,err:1,post:"down"},
 Frayed:{w:"Frayed",eff:"more errors, and the interesting ones",speed:.9,err:1.8,post:"tilt"},
 Done:{w:"Done",eff:"refuses the room it is in and moves itself",speed:.5,err:2.2,post:"sit"}
};
var ROOMCOL={triage:"#2F6E63",bay:"#2F6E63",treat:"#1F5148",day:"#2F6E63",store:"#3B2E20",
 staff:"#1F5148",office:"#3B2E20",lounge:"#2F6E63",coat:"#3B2E20"};
var UNHAPPY={
 door:"the door is unstaffed, so the queue started in the corridor",
 card:"the card and the patient do not match",

      away:S.away,lastSeen:Date.now(),report:S.report.slice(0,8),pending:S.pending,handover:S.handover};

function moveQueue(){
  var t=triageSlot();
  if(t<0){S.triageHeld=0;return;}
  S.triageHeld=(S.triageHeld||0)+1;
  if(S.triageHeld<2)return;
  S.triageHeld=0;

  if(!q.length||!b)return;

function bayWait(slot){

function bayStep(){
  var i,p,beds=bayBeds(),b;
  for(i=0;i<S.patients.length;i++){
    p=S.patients[i];
    if(p.st!=="bay")continue;
    p.wait++;
    b=null;
    for(var k=0;k<beds.length;k++)if(beds[k].slot===p.room&&beds[k].bed===p.bed)b=beds[k];
    if(p.wait>=bayWait(p.room)&&!p.ready){p.ready=1;p.why="";}
    if(!p.ready&&p.wait>=bayWait(p.room)+4&&!p.why)p.why="seen";
  }
  /* the day room takes the ones who can be moved on, and gives mood back */
  for(i=0;i<S.patients.length;i++){
    p=S.patients[i];
    if(p.st==="bay"&&p.ready&&p.why==="seen"&&roomsOf("day").length&&rnd()<0.25){
      p.st="day";p.room=roomsOf("day")[0];p.wait=0;p.why="";
    }
  }

function treatSlotFree(){

function treatStep(){
  var ts=treatSlotFree(),i,p,best=null;
  if(ts>=0){
    for(i=0;i<S.patients.length;i++){
      p=S.patients[i];
      if(p.st!=="bay"||!p.ready)continue;
      if(!best||p.wait>best.wait)best=p;
    }
    if(best){
      var r=S.rooms[ts];
      best.st="treat";best.room=ts;best.bed=1;best.wait=0;best.pay0=best.pay;
      r.busy=best.id;r.busyLeft=3;
      S.note=shortName(best)+" is in the treatment room.";
    }
  }
  for(i=0;i<6;i++){
    var rr=S.rooms[i];
    if(rr.t!=="treat"||!rr.busy)continue;
    rr.busyLeft--;
    if(rr.busyLeft>0)continue;
    var q=patientById(rr.busy);

function finishCase(p){
  var good=(p.card===p.card0),pay=p.pay0||p.pay,note;
  if(good&&p.cond==="Damp Hat"&&roomsOf("coat").length)pay=Math.round(pay*1.2);
  if(!good){
    pay=Math.round(pay*0.5);
    S.wrongKit++;
    note=shortName(p)+" was treated on the wrong card and the ward has written it up";
  }else{
    S.treated++;
    note=shortName(p)+" went home after "+p.cond;
  }
  S.cash+=pay;
  S.lastPay=pay;
  S.note=note;
  p.st=roomsOf("lounge").length?"lounge":"discharge";
  p.room=roomsOf("lounge").length?roomsOf("lounge")[0]:-1;p.wait=0;p.treated=1;
  p.why="";
}
function shortName(p){return p.first+" "+p.last.slice(0,1)+".";}
function dischargeStep(){
  var i,p;
  for(i=S.patients.length-1;i>=0;i--){
    p=S.patients[i];
    if(p.st==="lounge"){p.wait++;if(p.wait>=3){p.st="home";S.done++;}}
    else if(p.st==="discharge"){p.wait++;if(p.wait>=2){p.st="home";S.done++;}}
  }
  for(i=S.patients.length-1;i>=0;i--)if(S.patients[i].st==="home")S.patients.splice(i,1);
}
/* ---- moods, traits and rest ---- */
function moodUp(st){
  var i=MOODLADDER.indexOf(st.mood);
  if(i<MOODLADDER.length-1){st.mood=MOODLADDER[i+1];st.moodN=0;}
}
function moodDown(st){
  var i=MOODLADDER.indexOf(st.mood);
  if(i>0){st.mood=MOODLADDER[i-1];st.moodN=0;}
}
function bumpTrait(st,name,to){
  var i;
  for(i=0;i<st.traits.length;i++){
    if(st.traits[i].n===name){st.traits[i].c++;return;}
  }
  for(i=0;i<st.traits.length;i++){
    if(st.traits[i].from==="at hire"){st.traits[i]={n:name,from:"from the evidence",c:1};return;}
  }
}
function driftSlot(){
  var order=["treat","triage","bay"],i,k;
  for(k=0;k<order.length;k++)for(i=0;i<6;i++){
    if(S.rooms[i].t===order[k]&&!S.rooms[i].blocked&&!staffAt(i))return i;
  }
  return -1;
}
function moodStep(){
  var i,st,day=roomsOf("day"),resting;
  for(i=0;i<S.staff.length;i++){
    st=S.staff[i];
    st.moodN++;
    resting=(st.at>=0&&(S.rooms[st.at].t==="day"||S.rooms[st.at].t==="staff"));
    if(st.at>=-1&&!resting){
      st.tired++;
      if(st.tired>7&&st.mood!=="Brisk"){moodDown(st);st.tired=0;
        st.note=st.mood==="Done"?"has had enough of this room":st.note;}
      if(st.mood==="Frayed"&&rnd()<0.08){st.mistakes++;bumpTrait(st,"hopeless with numbers");}
    }else if(resting){
      st.tired=Math.max(0,st.tired-2);
      if(st.tired===0&&st.mood!=="Steady"){moodUp(st);st.note="came back round in the "+S.rooms[st.at].t+" room";}
    }else{
      st.tired=Math.max(0,st.tired-1);
      if(st.tired===0&&st.mood!=="Steady"&&st.mood!=="Brisk")moodUp(st);
      /* a ward with nobody on the floor pulls its own people back in */
      if(st.mood==="Steady"&&st.at===-2&&S.acts%4===0&&S.onFloor<2){
        var want=driftSlot();
        if(want>=0){st.at=want;st.note="drifted back to the "+roomDef(S.rooms[want].t).n.toLowerCase();syncRooms();}
      }
    }
    if(st.mood==="Done"&&st.at>=-1&&!resting){
      st.at=-2;st.note="stopped, put the charts down and came off the floor";
      if(day.length){st.at=day[0];st.note="had enough of the room and went to the day room";}
    }
  }
  if(S.acts%9===0){
    for(i=0;i<S.staff.length;i++){
      st=S.staff[i];
      if(st.at>=0&&S.load>70&&st.mood==="Steady"){moodDown(st);st.note="went flat with a full ward";}
    }
  }
}
function restStaff(id){
  var st=staffById(id),s=roomsOf("staff");
  if(!st||!s.length)return 0;
  st.at=s[0];st.tired=0;st.note="took a break in the staff room";
  S.note=st.first+" has gone to the staff room.";
  return 1;
}
/* ---- the load, and what it does ---- */
function loadCalc(){
  var q=queueList().length,occ=0,bl=0,i;
  for(i=0;i<S.patients.length;i++)if(S.patients[i].st==="bay"||S.patients[i].st==="treat")occ++;
  for(i=0;i<6;i++)if(S.rooms[i].blocked)bl++;
  S.load=clamp(Math.round(q*7+occ*6+bl*9),0,100);
  if(S.load>S.peak)S.peak=S.load;
}
function doorW(){var i,r=roomsOf("treat");if(!r.length)return 70;return S.rooms[r[0]].door;}
/* ---- the events ---- */
function raiseCall(){
  if(S.pending)return 0;
  var floor=[],i,st;
  for(i=0;i<S.staff.length;i++){st=S.staff[i];if(st.at>=-1&&st.mood!=="Brisk")floor.push(st);}
  if(!floor.length)return 0;
  var low=null;
  for(i=0;i<floor.length;i++){
    if(floor[i].mood==="Frayed"||floor[i].mood==="Done"){low=floor[i];break;}
    if(floor[i].mood==="Flat"&&!low)low=floor[i];
  }
  st=low||floor[ri(0,floor.length-1)];
  var pool=[],c;
  for(i=0;i<CALLS.length;i++){
    c=CALLS[i];
    if(c.role&&c.role!==st.role)continue;
    if(c.t==="The card does not match the patient"&&!S.swapPair)continue;
    if(c.t==="Someone has moved the scanner"&&!S.snag)continue;
    if(c.t==="Two patients want the same bed"&&queueList().length<2)continue;
    pool.push(c);
  }
  if(!pool.length)pool=CALLS.slice(0,3);
  S.pending={staff:st.id,i:Math.floor(rnd()*pool.length),c:pool[Math.floor(rnd()*pool.length)],raised:S.acts};
  S.note=st.first+" has raised something with you.";
  return 1;
}
function answerCall(choice){
  var P=S.pending;
  if(!P)return 0;
  var st=staffById(P.staff),c=P.c,a=choice?c.b:c.a;
  S.calls=(S.calls||0)+1;
  if(choice===0){
    moodUp(st);st.tired=0;bumpTrait(st,"kind");
    S.late=(S.late||0)+1;
    if(c.t==="The card does not match the patient"&&S.swapPair){fixSwap();S.cardCall=1;}
    if(c.t==="Someone has moved the scanner"&&S.snag)widenKit(1);
    if(c.t==="Two patients want the same bed"&&queueList().length>1){S.moved++;sortQueue();}
    if(c.t==="A patient has been in the bay since dawn"){
      var q=null,i;
      for(i=0;i<S.patients.length;i++)if(S.patients[i].st==="bay"){q=S.patients[i];break;}
      if(q)q.wait+=2;
    }
    st.note="worked it through with you: "+c.t.toLowerCase();
  }else{
    moodDown(st);bumpTrait(st,"unhurried");
    S.deferred++;
    if(c.t==="The card does not match the patient"){S.cardCall=2;}
    if(c.t==="Someone has moved the scanner"){S.cardCall=2;}
    st.note="was told to carry on: "+c.t.toLowerCase();
  }
  S.pending=null;
  S.note=shortWho(st.id)+": "+a.l+".";
  return 1;
}
function sortQueue(){
  var q=queueList(),i;
  for(i=0;i<q.length;i++)q[i].ord=i;
}
function swapCards(){
  var bay=[],i,p;
  for(i=0;i<S.patients.length;i++){
    p=S.patients[i];
    if(p.st==="bay"&&p.card===p.card0)bay.push(p);
  }
  if(bay.length<2)return 0;
  var a=bay[0],b=bay[1],t;
  t=a.card;a.card=b.card;b.card=t;
  t=a.cardCond;a.cardCond=b.cardCond;b.cardCond=t;
  S.swapPair=[a.id,b.id];
  S.misplace++;
  S.note="Two cards have been left in the wrong beds.";
  return 1;
}
function fixSwap(){
  var pair=S.swapPair;
  if(!pair)return 0;
  var a=patientById(pair[0]),b=patientById(pair[1]),t;
  if(a&&b){
    t=a.card;a.card=b.card;b.card=t;
    t=a.cardCond;a.cardCond=b.cardCond;b.cardCond=t;
    var st=staffById(S.pending?S.pending.staff:0);
  }
  S.swapPair=null;S.fixedSwap=(S.fixedSwap||0)+1;
  S.note="The cards are back in the right beds.";
  return 1;
}
function snagKit(){
  var r=roomsOf("treat"),i;
  if(!r.length)return 0;
  var slot=r[0],room=S.rooms[slot];
  if(room.door>=90)return 0;
  room.blocked=1;room.fitted=0;room.kitIn="the scanner, 90cm";
  S.snag=1;S.blockedTiles=1;
  S.note="The new scanner has arrived. It does not go through a "+room.door+"cm door.";
  return 1;
}
function widenKit(quiet){
  var r=roomsOf("treat"),i;
  if(!r.length)return 0;
  var room=S.rooms[r[0]];
  room.door=110;room.blocked=0;room.fitted=1;room.kitIn="";
  S.snagFixed=(S.snagFixed||0)+1;S.blockedTiles=0;
  if(!quiet)S.note="The treatment room door is 110cm and the scanner is in.";
  return 1;
}
function visitorStep(){
  if(S.visitor||S.visited)return 0;
  if(S.load<70)return 0;
  S.visitor={raised:S.acts,v:"consultant"};
  S.note="A consultant is standing at the ward door.";
  return 1;
}
function handleVisitor(choice){
  if(!S.visitor)return 0;
  var i,st;
  if(choice==="consultant"){
    S.visited=2;S.late=(S.late||0)+1;
    for(i=0;i<S.staff.length;i++){st=S.staff[i];if(st.at>=-1)moodUp(st);}
    S.note="You walked the round with the consultant. It took the whole middle of the day.";
  }else{
    S.visited=1;
    for(i=0;i<S.staff.length;i++){st=S.staff[i];if(st.at===0)moodDown(st);}
    S.note="The senior nurse took the consultant round. She was not pleased about it.";
  }
  S.visitor=null;
  return 1;
}
/* ---- the twelve acts of a visit ---- */
function stepDone(n){
  switch(n){
    case 1:return S.seen>0?1:0;
    case 2:return S.looked?1:0;
    case 3:return (S.calls||0)>=1?1:0;
    case 4:return S.readAll?1:0;
    case 5:return (S.moved||0)>=1||S.leftOrder?1:0;
    case 6:return (S.calls||0)>=2||S.deferJune?1:0;
    case 7:return !!S.cardCall?1:0;
    case 8:return !!S.handover?1:0;
    case 9:return !!S.snagFixed||!!S.snagLeft?1:0;
    case 10:return !!S.visited?1:0;
    case 11:return (S.acts-S.act10At)>=5?1:0;
    case 12:return !!S.signed?1:0;
  }
  return 0;
}
var STEPTXT=[
 ["The door","Someone has come through the ward door. Get them seen in, or the queue starts in the corridor."],
 ["The look","Walk the round. Six rooms, and the ward tells you what it is short of."],
 ["The first call","A member of staff has stopped and is waiting to be answered."],
 ["The round","Read every occupied room. The cards, the beds and the moods."],
 ["The queue","Triage sorts the queue. You can set it by hand, or leave triage to it."],
 ["The interruption","The ward will raise a second problem. Answering costs the round time, deferring costs the mood."],
 ["The misplacement","Two cards have gone to the wrong beds. Fix them, or treat on the card."],
 ["The hand-over","Pick the one thing you are going to run by hand for the rest of the visit."],
 ["The snag","The new kit is in the corridor and it does not go through the door."],
 ["The visitor","A consultant is at the door and the ward is full."],
 ["The settling","Nothing to do but watch the ward settle. It will tell you if it needs you."],
 ["The sign-off","Write the visit off. The grade goes in the register either way."]
];
function stepNo(){
  var n=1,i;
  for(i=1;i<=12;i++){if(!stepDone(i)){n=i;break;}n=13;}
  return Math.min(n,12);
}
function visitStep(){
  var n=stepNo();
  S.act=n;
  if(n!==S.actWas){
    S.actWas=n;
    if(n===6&&!S.sixAt)S.sixAt=S.acts;
    if(n===11&&!S.act10At)S.act10At=S.acts;
    if(n===6&&S.acts-S.sixAt>8&&!stepDone(6))S.deferJune=1;
  }
  /* events fire on the ward's own clock, not the player's */
  var freeHand=0,i;
  for(i=0;i<S.staff.length;i++)if(S.staff[i].at>=-1)freeHand=1;
  if(!S.pending&&freeHand&&S.acts-(S.lastCall||0)>=(S.calls?7:2)){
    if(raiseCall()){S.lastCall=S.acts;S.modalOff=0;}
  }
  if(S.acts===11&&!S.misplace)swapCards();
  if(S.acts===17&&roomsOf("treat").length&&!S.snag)snagKit();
  if(S.acts>=6)visitorStep();
}
function peakLoad(){return S.peak||S.load;}
/* ---- grading ---- */
function gradeNow(){
  var g=46,i,st,frayed=0,blocked=0;
  for(i=0;i<6;i++)if(S.rooms[i].blocked)blocked++;
  for(i=0;i<S.staff.length;i++){
    st=S.staff[i];
    if(st.mood==="Frayed"||st.mood==="Done")frayed++;
  }
  g+=S.treated*8;
  g-=S.wrongKit*11;
  g-=S.deferred*5;
  g-=blocked*6;
  g-=frayed*4;
  g+=S.fixedSwap?7:0;
  g+=S.visited===2?6:0;
  g+=S.handover==="mood"?(frayed?0:5):0;
  g+=S.handover==="queue"?(S.deferred?0:4):0;
  g+=S.handover==="kit"?(blocked?0:4):0;
  g-=peakLoad()>85?4:0;
  return clamp(Math.round(g),0,100);
}
function signOff(){
  if(S.signed)return 0;
  var g=gradeNow(),i,blocked=0;
  for(i=0;i<6;i++)if(S.rooms[i].blocked)blocked++;
  S.grade=g;S.graded=(S.graded||0)+1;S.signed=1;
  S.peak=S.peak?S.peak:S.load;
  S.register.push({day:S.day,visit:S.visit,grade:g,treated:S.treated,wrongKit:S.wrongKit,
    deferred:S.deferred,blocked:blocked,note:S.note||"",away:0});
  if(S.register.length>40)S.register.shift();
  var sum=0,n=0;
  for(i=0;i<S.register.length;i++){sum+=S.register[i].grade;n++;}
  S.standing=n?Math.round(sum/n):g;
  standingUnlock();
  S.note="Visit signed off: grade "+g+".";
  S.act=12;
  save();
  return 1;
}
function standingUnlock(){
  var i;
  if(S.standing>=62&&S.register.length>=1&&S.unlocks.indexOf("five-ward")<0)S.unlocks.push("five-ward");
  if(S.standing>=74&&S.register.length>=3&&S.unlocks.indexOf("the-coat-room")<0)S.unlocks.push("the-coat-room");
}
function nextVisit(){
  var i,p;
  S.visit++;S.day++;
  S.acts=0;S.clock=0;S.pending=null;S.visitor=null;S.handover="";S.signed=0;
  S.treated=0;S.wrongKit=0;S.deferred=0;S.seen=0;S.misplace=0;S.snag=0;S.snagFixed=0;
  S.swapPair=null;S.cardCall=0;S.calls=0;S.lastCall=0;S.looked=0;S.readAll=0;S.moved=0;S.leftOrder=0;
  S.deferJune=0;S.visited=0;S.act10At=0;S.sixAt=0;S.peak=0;S.done=0;S.actWas=0;S.act=1;
  for(i=S.patients.length-1;i>=0;i--){p=S.patients[i];if(p.st!=="bay"&&p.st!=="treat"&&p.st!=="lounge"&&p.st!=="day")S.patients.splice(i,1);}
  for(i=0;i<6;i++){S.rooms[i].busy=0;S.rooms[i].busyLeft=0;}
  save();
  return 1;
}
/* ---- the absence tick, which pays money and writes the report ---- */
function awayTick(hours){
  if(hours<0.5)return 0;
  var shifts=Math.min(6,Math.floor(hours/8)),pay=0,i,st,lines=[],kind;
  if(shifts<1)shifts=1;
  pay=shifts*Math.round(90+S.standing*1.7);
  S.cash+=pay;
  S.awayShifts=(S.awayShifts||0)+shifts;
  for(i=0;i<S.staff.length;i++){
    st=S.staff[i];
    if(rnd()<0.5)moodUp(st);else if(rnd()<0.4)moodDown(st);
    st.at=-1;st.tired=0;
  }
  lines.push("You were away for "+shifts+(shifts===1?" shift.":" shifts."));
  lines.push("The ward carried on and paid in "+money(pay)+".");
  for(i=0;i<3;i++){
    st=S.staff[Math.floor(rnd()*S.staff.length)];
    kind=st.mood==="Steady"||st.mood==="Brisk"?"good":(st.mood==="Flat"?"flat":"bad");
    var pool=[],k;
    for(k=0;k<REPORTS.length;k++)if(REPORTS[k].t===kind)pool=REPORTS[k].l;
    var line=pool[Math.floor(rnd()*pool.length)];
    lines.push(line.replace(/\{who\}/g,st.first).replace(/\{n\}/g,String(ri(2,9))).replace(/\{room\}/g,"the bays"));
    if(rnd()<0.4)bumpTrait(st,st.mood==="Steady"?"thorough":"unhurried");
  }
  S.register.push({day:S.day,visit:S.visit,grade:S.standing,treated:0,wrongKit:0,deferred:0,blocked:0,
    note:shifts+" shift"+(shifts===1?"":"s")+" away, "+money(pay)+" paid in",away:shifts});
  if(S.register.length>40)S.register.shift();
  S.report=lines;
  S.away=0;
  S.note="The ward has carried on without you.";
  save();
  return 1;
}
/* ---- the tick ---- */
function tick(dt){
  S.clock+=dt/ACTSECONDS;
  var guard=0;
  while(S.clock>=1&&guard++<50){
    S.clock-=1;
    wardAct();
  }
}
function wardAct(){
  S.acts++;
  arrivals();
  moveQueue();
  bayStep();
  treatStep();
  dischargeStep();
  syncRooms();
  moodStep();
  syncRooms();
  loadCalc();
  visitStep();
  if(!S.norender&&S.acts%2===0)save();
}
function walkRound(){
  var i,any=0;
  for(i=0;i<6;i++){
    if(S.rooms[i].t&&(stateOf(i).w==="work"||stateOf(i).w==="wait"))any=1;
  }
  S.looked=1;
  if(any){
    S.readAll=1;
    S.note="Round walked. Every occupied room has been read.";
  }else S.note="Round walked. The ward is quiet.";
  return 1;
}

   6. THE PICTURE ON TOP. Strip, act band, bar, sheets, modal.

/* ---------------- the call modal ---------------- */
function renderCallBox(){
  var m=el("md-call"),box=el("md-body");
  if(!S.pending||S.modalOff){m.className="modal";box.innerHTML="";return;}
  var P=S.pending,st=staffById(P.staff);
  box.innerHTML='<div class="who">'+figIcon(st)+'<div><h2>'+esc(P.c.t)+'</h2>'+

var SHEETS=["sh-room","sh-patient","sh-build","sh-staff","sh-report","sh-choice","sh-chain"];
function openSheet(id,w){

function closeSheets(){
  var i;

}
function renderSheet(){
  if(!S.sheet)return;
  var body=el(S.sheet).querySelector(".bd");
  if(!body)return;
  var h="";
  if(S.sheet==="sh-room")h=roomHTML(S.with.slot);
  else if(S.sheet==="sh-patient")h=patientHTML(S.with.id);
  else if(S.sheet==="sh-build")h=buildHTML();
  else if(S.sheet==="sh-staff")h=staffHTML();
  else if(S.sheet==="sh-report")h=S.resultHTML?resultHTML():reportHTML();
  else if(S.sheet==="sh-choice")h=S.with.kind==="visitor"?visitorHTML():handoverHTML();
  else if(S.sheet==="sh-chain")h=chainHTML();
  var hd=el(S.sheet).querySelector(".hd");
  if(hd)hd.outerHTML=h.head;

  bd.innerHTML=h.body+footBtn(h.foot||"Back to the ward",h.footAct);

    '<button class="alt" data-a="away" data-arg="8">Step away for eight hours</button>'+
    '<button class="alt" data-a="away" data-arg="48">Step away for two days</button></div>';
  h+='<div class="card warnx"><h3>Start again</h3><p>This clears the register, the roster and the ward.</p>'+
    '<button class="warnx" data-a="reset">'+(S.confirm==="reset"?"Confirm: clear the ward and start again":"Clear the ward and start again")+'</button></div>';
  return wrap(head,h,"Back to the ward");
}
function chainNext(){
  if(S.staff.length<2)return "Take somebody on before the next visit.";
  if(S.standing<62)return "A standing grade of 62 brings the coat room onto the build sheet.";
  if(S.standing<74)return "A standing grade of 74 is where the chain starts watching.";
  return "The chain is watching this ward now.";

/* ============================================================
   7. THE SOUND. Off until the player asks for it. Short cues
   made here from an oscillator, and nothing touches the network.
   ============================================================ */
var _ac=null;
function cue(kind){
  if(!S||!S.sound)return;
  try{
    if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();
    var t=_ac.currentTime,o=_ac.createOscillator(),g=_ac.createGain();
    var hz=kind==="money"?520:(kind==="call"?300:(kind==="ok"?660:420));
    o.type=kind==="call"?"triangle":"sine";
    o.frequency.setValueAtTime(hz,t);
    if(kind==="money")o.frequency.linearRampToValueAtTime(hz*1.5,t+0.12);
    if(kind==="call")o.frequency.linearRampToValueAtTime(hz*0.8,t+0.18);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.09,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g);g.connect(_ac.destination);
    o.start(t);o.stop(t+0.22);
  }catch(e){}
}
function buzz(ms){
  if(!S.haptics)return;
  try{if(navigator.vibrate)navigator.vibrate(ms||12);}catch(e){}
}
/* ============================================================
   8. EVERY ACTION A PLAYER CAN TAKE.
   GAME.act takes these names. The comment block above GAME.act
   lists them for whoever is testing the build.
     walk ............. walk the round, reading every occupied room
     room slot ........ open the room card for a slot, 0 to 5
     door ............. open the ward door card, which holds the queue
     corridor ......... open the corridor card, which holds the blocked tile
     patient id ....... open the patient card
     build ............ open the build sheet
     pick roomType .... choose a room type to put in an open slot
     place slot ....... build the chosen room in that slot and pay for it
     widen slot ....... widen that room's door to 110cm and unblock it
     store slot ....... send the scanner back to the store and unblock it
     demolish slot .... clear that room and take 80% of its cost back
     post staffId slot  post a member of staff to a slot, -1 is the ward door
     off staffId ...... take a member of staff off the floor
     rest staffId ..... send a member of staff to the staff room
     name staffId ..... write that member of staff another name
     hire role ........ take somebody on, role is porter, nurse or doctor
     sort key ......... sort the roster by role, mood or last
     answer 0 or 1 .... answer the call on the screen, 0 is the first choice
     callLater ........ close the call and leave it on the bar
     opencall ......... open the call again
     swap id .......... swap both cards back into the right beds
     carry id ......... treat on the card as written
     move id dir ...... move a patient in the queue, dir is -1 or 1
     leaveOrder ....... leave the queue order to triage
     toTreat id ....... take that patient to the treatment room by hand
     handover aspect .. run queue, kit or mood by hand
     visitor choice ... walk the consultant round or send the senior nurse
     signOff .......... sign the visit off, write the grade in the register
     nextVisit ........ begin the next visit
     report ........... reopen the shift report
     chain ............ open the chain card, the register and the settings
     roster ........... open the staff panel
     sound/motion/haptics  toggle that setting
     scale 0..2 ....... text size
     strip load/grade/staff  the third slot in the strip
     away hours ....... step away for that many hours, which pays and reports
     reset ............ clear the ward and start again, twice to confirm
     close ............ close whatever is open and go back to the ward
   ============================================================ */
function act(name,arg,arg2){
  var i,st,n;
  switch(name){
    case "walk":walkRound();break;
    case "room":
      n=parseInt(arg,10);
      if(n>=0&&n<6)openSheet("sh-room",{slot:n});
      break;
    case "door":openSheet("sh-room",{slot:-1});break;
    case "corridor":openSheet("sh-room",{slot:-2});break;
    case "queue":openSheet("sh-room",{slot:-1});break;
    case "patient":openSheet("sh-patient",{id:parseInt(arg,10)});break;
    case "build":openSheet("sh-build");break;
    case "roster":openSheet("sh-staff");break;
    case "chain":openSheet("sh-chain");break;
    case "report":S.resultHTML=0;openSheet("sh-report");break;
    case "close":closeSheets();S.modalOff=0;break;
    case "pick":S.pick=arg;break;
    case "place":placeRoom(parseInt(arg,10),S.pick);break;
    case "widen":widen(slotWanted(arg));break;
    case "store":storeKit(slotWanted(arg));break;
    case "demolish":demolish(parseInt(arg,10));break;
    case "post":post(parseInt(arg,10),parseInt(arg2,10));break;
    case "off":offFloor(parseInt(arg,10));break;
    case "rest":restStaff(parseInt(arg,10));break;
    case "name":rename(parseInt(arg,10));break;
    case "hire":hire(arg);break;
    case "sort":S.sort=arg;break;
    case "answer":answerCall(parseInt(arg,10));S.modalOff=0;break;
    case "callLater":S.modalOff=1;break;
    case "opencall":S.modalOff=0;break;
    case "swap":fixSwap();S.cardCall=1;break;
    case "carry":S.cardCall=2;S.note="The ward treated on the card as written.";break;
    case "move":moveInQueue(parseInt(arg,10),parseInt(arg2,10));break;
    case "leaveOrder":S.leftOrder=1;S.note="The order stays with triage.";break;
    case "toTreat":toTreat(parseInt(arg,10));break;
    case "handover":S.handover=arg;S.note="You are running the "+arg+" by hand.";break;
    case "visitor":handleVisitor(arg);break;
    case "signOff":signOff();S.resultHTML=1;openSheet("sh-report");break;
    case "nextVisit":S.resultHTML=0;S.signed=0;nextVisit();closeSheets();break;
    case "sound":S.sound=S.sound?0:1;if(S.sound)cue("ok");break;
    case "motion":S.motion=S.motion?0:1;break;
    case "haptics":S.haptics=S.haptics?0:1;buzz(14);break;
    case "scale":S.scale=parseInt(arg,10)||0;applyScale();break;
    case "strip":S.strip=arg;break;
    case "away":awayTick(parseFloat(arg)||8);S.resultHTML=0;openSheet("sh-report");break;
    case "reset":
      if(S.confirm==="reset"){doReset();return true;}
      S.confirm="reset";break;
    default:return false;
  }
  S.dirty=1;
  syncRooms();
  if(!S.norender)render();
  if(!S.norender&&name!=="close")save();
  return true;
}
function placeRoom(slot,type){
  var d=roomDef(type),r=roomAt(slot);
  if(!d||!r||r.t)return 0;
  if(S.cash<d.cost)return 0;
  if(type==="coat"&&S.standing<62)return 0;
  S.cash-=d.cost;
  S.rooms[slot]=mkRoom(type,slot);
  if(type==="treat"&&S.rooms[slot].door<90){/* the kit lands at the snag, not at the build */}
  S.pick="";
  S.note="The "+d.n+" is in slot "+(slot+1)+". It cost "+money(d.cost)+".";
  return 1;
}
function slotWanted(arg){
  var n=parseInt(arg,10),i;
  if(n>=0&&n<6)return n;
  for(i=0;i<6;i++)if(S.rooms[i].blocked)return i;
  for(i=0;i<6;i++)if(S.rooms[i].t==="treat")return i;
  return -1;
}
function widen(slot){
  var r=roomAt(slot),d;
  if(!r)return 0;
  d=roomDef(r.t);
  if(!r||!r.t)return 0;
  if(S.cash<450)return 0;
  S.cash-=450;r.door=110;
  if(r.blocked){r.blocked=0;r.fitted=1;r.kitIn="";S.blockedTiles=0;S.snagFixed=(S.snagFixed||0)+1;}
  S.note="The door at slot "+(slot+1)+" is 110cm now.";
  return 1;
}
function storeKit(slot){
  var r=roomAt(slot);
  if(!r)return 0;
  if(!r||!r.blocked)return 0;
  r.blocked=0;r.fitted=0;r.kitIn="";
  S.cash+=290;S.blockedTiles=0;S.snagLeft=1;
  S.note="The scanner has gone back to the store. The room works on the old trolley kit for half the pay.";
  return 1;
}
function demolish(slot){
  var r=roomAt(slot),d,k,lastTreat=0,lastTriage=0;
  if(!r||!r.t)return 0;
  if(S.confirm!==slot){S.confirm=slot;return 1;}
  S.confirm=0;
  for(k=0;k<6;k++){
    if(S.rooms[k].t==="treat")lastTreat++;
    if(S.rooms[k].t==="triage")lastTriage++;
  }
  if(r.t==="treat"&&lastTreat<2){S.note="The ward has to keep one treatment room.";return 0;}
  if(r.t==="triage"&&lastTriage<2){S.note="The ward has to keep one triage room.";return 0;}
  S.cash+=Math.round(d.cost*0.8);
  S.rooms[slot]=mkRoom("",slot);
  S.note="Slot "+(slot+1)+" is clear. The ward took "+money(Math.round(d.cost*0.8))+" back.";
  return 1;
}
function post(id,slot){
  var st=staffById(id);
  if(!st)return 0;
  if(slot>=-1&&slot<6)st.at=slot;
  st.tired=0;
  st.note="was posted to "+(slot===-1?"the ward door":("slot "+(slot+1)));
  S.note=st.first+" is on "+(slot===-1?"the ward door":("slot "+(slot+1)))+".";
  return 1;
}
function offFloor(id){
  var st=staffById(id);
  if(!st)return 0;
  st.at=-2;st.note="came off the floor";
  S.note=st.first+" is off the floor.";
  return 1;
}
function rename(id){
  var st=staffById(id),old;
  if(!st)return 0;
  old=st.first;st.first=pick(FIRSTS);
  st.last=pick(LASTS);
  S.note=old+" is called "+st.first+" "+st.last+" now.";
  return 1;
}
function hire(role){
  var cost=role==="doctor"?980:(role==="nurse"?700:480);
  if(S.cash<cost)return 0;
  S.cash-=cost;
  S.staff.push(newStaff(role));
  S.note="Somebody new is on the books.";
  return 1;
}
function moveInQueue(id,dir){
  var p=patientById(id),q=queueList(),i,t;
  if(!p||p.st!=="queue")return 0;
  for(i=0;i<q.length;i++)if(q[i].id===id)break;
  var j=i+(dir<0?-1:1);
  if(j<0||j>=q.length)return 0;
  t=q[i].ord;q[i].ord=q[j].ord;q[j].ord=t;
  S.moved=(S.moved||0)+1;
  S.note="You set the queue by hand.";
  return 1;
}
function toTreat(id){
  var p=patientById(id),ts=treatSlotFree();
  if(!p||p.st!=="bay"||ts<0)return 0;
  var r=S.rooms[ts];
  p.st="treat";p.room=ts;p.bed=1;p.wait=0;p.pay0=p.pay;
  r.busy=p.id;r.busyLeft=3;
  S.note=shortName(p)+" was taken to the treatment room by hand.";
  return 1;
}

/* ============================================================
   9. ROUTES. One tap handler for every control in the ward, so
   the buttons and GAME.act are the same code path.
   ============================================================ */
function onClick(e){
  var t=e.target,guard=0;
  while(t&&t!==document.body&&guard++<8){
    if(t.getAttribute&&t.getAttribute("data-a"))break;
    t=t.parentNode;
  }
  if(!t||t===document.body||!t.getAttribute)return;
  if(t===el("veil")){closeSheets();S.modalOff=1;return;}
  var a=t.getAttribute("data-a");
  if(a==="answer"||a==="callLater")cue(a==="answer"?"ok":"click");
  else if(a==="signOff")cue("money");
  else cue("click");
  buzz(10);
  act(a,t.getAttribute("data-arg"),t.getAttribute("data-arg2"));
}
function onKey(e){
  if(e.key==="Escape"){
    if(el("md-call").className==="on"){S.modalOff=1;render();}
    else closeSheets();
    render();
  }
}
/* ============================================================
   10. THE TEST HOOKS. seed, state, act, advance, problems.
   ============================================================ */
function stateObj(){
  var on=0,i,pend="";
  for(i=0;i<S.staff.length;i++)if(S.staff[i].at>=-1)on++;
  if(S.pending)pend=shortWho(S.pending.staff);
  return {
    screen:S.sheet||"ward",act:S.act,day:S.day,visit:S.visit,
    cash:Math.round(S.cash),queue:queueList().length,load:S.load,peak:peakLoad(),
    standing:S.standing,grade:S.grade,graded:S.graded||0,
    rooms:(function(){var n=0,k;for(k=0;k<6;k++)if(S.rooms[k].t)n++;return n;})(),
    openSlots:(function(){var n=0,k;for(k=0;k<6;k++)if(!S.rooms[k].t)n++;return n;})(),
    staff:S.staff.length,onFloor:on,
    patients:S.patients.length,treated:S.treated,wrongKit:S.wrongKit,deferred:S.deferred,
    seen:S.seen,misplaced:S.misplace,snag:S.snag,snagFixed:S.snagFixed||0,
    calls:S.calls||0,pending:pend,modal:S.pending&&!S.modalOff?1:0,
    handover:S.handover||"",visitor:S.visited||0,
    blocked:(function(){var n=0,k;for(k=0;k<6;k++)if(S.rooms[k].blocked)n++;return n;})(),
    unlocks:S.unlocks.length,register:S.register.length,reportLines:S.report.length,
    awayShifts:S.awayShifts||0,
    treatedNow:S.treated,loadNow:S.load,
    sound:S.sound?1:0,motion:S.motion?1:0,haptics:S.haptics?1:0,scale:S.scale,strip:S.strip,sort:S.sort,
    signed:S.signed?1:0,result:S.resultHTML?1:0,acted:S.acted||0,
    actsInVisit:S.acts,
    problems:problems().length
  };
}
function problems(){
  var out=[],k,i,nums,more;
  nums={cash:S.cash,load:S.load,standing:S.standing,grade:S.grade,day:S.day,visit:S.visit,
    acts:S.acts,queue:queueList().length};
  for(k in nums)
    if(typeof nums[k]!=="number"||isNaN(nums[k])||!isFinite(nums[k]))out.push("state "+k+" is not a finite number");
  if(S.rooms.length!==6)out.push("the ward does not have six slots");
  if(S.staff.length<2)out.push("fewer than two on the roster");
  if(queueList().length>9)out.push("the queue has run past what the corridor holds");
  if(S.load<0||S.load>100)out.push("the load has left the range the ward uses");
  if(S.cash<0)out.push("the cash has gone negative");
  if(!roomsOf("triage").length)out.push("the ward has no triage room");
  if(!roomsOf("treat").length)out.push("the ward has no treatment room");
  if(S.pending&&!staffById(S.pending.staff))out.push("a call is open on somebody who is not on the roster");
  if(!el("b-main").getAttribute("data-a"))out.push("the bar has no way on");
  for(i=0;i<6;i++){
    if(S.rooms[i].t==="")continue;
    if(!roomDef(S.rooms[i].t))out.push("slot "+(i+1)+" holds a room type the ward does not know");
    if(S.rooms[i].door<40||S.rooms[i].door>220)out.push("slot "+(i+1)+" has a door width that is not a width");
  }
  for(i=0;i<S.patients.length;i++){
    var p=S.patients[i];
    if(p.st==="bay"){
      var r=roomAt(p.room);
      if(!r||r.t!=="bay")out.push("a patient is bedded in a room that is not a bay");
      if(p.bed!==1&&p.bed!==2)out.push("a patient is in a bed that does not exist");
    }
    if(!p.cond||CONDS.map(function(c){return c.n;}).indexOf(p.cond)<0)
      out.push("a patient has a condition the ward does not treat");
  }
  more=scanText().concat(scanTargets(),scanHandlers(),scanExternal());
  for(i=0;i<more.length;i++)if(out.indexOf(more[i])<0)out.push(more[i]);
  return out;
}
var TEXTBAN=["\u2014","\u2013","!","not built","coming soon","placeholder","does nothing",
  "not working yet","lorem","todo","tbd","undefined","NaN","null","hermes","subagent","file://","/home/"];
function scanText(){
  var bad=[],seen={},i,j,nodes=document.querySelectorAll("#phone *");
  for(i=0;i<nodes.length;i++){
    var node=nodes[i];
    if(node.closest&&node.closest("svg"))continue;
    var own="",kids=node.childNodes;
    for(j=0;j<kids.length;j++)if(kids[j].nodeType===3)own+=kids[j].nodeValue;
    if(!own.trim())continue;
    var low=own.toLowerCase();
    for(var b=0;b<TEXTBAN.length;b++){
      if(low.indexOf(TEXTBAN[b].toLowerCase())>=0){
        var key=TEXTBAN[b]+"|"+own.trim().slice(0,40);
        if(!seen[key]){seen[key]=1;bad.push("banned text "+JSON.stringify(TEXTBAN[b])+" in "+JSON.stringify(own.trim().slice(0,50)));}
      }
    }
  }
  return bad;
}
function scanTargets(){
  var bad=[],btns=document.querySelectorAll("#phone button"),i;
  for(i=0;i<btns.length;i++){
    var b=btns[i];
    if(b.offsetParent===null&&b.getClientRects().length===0)continue;
    var r=b.getBoundingClientRect();
    if(r.width<44||r.height<44)
      bad.push("tap target under 44: "+(b.id||(b.textContent||"").trim().slice(0,24))+" is "+
        Math.round(b.offsetWidth)+" by "+Math.round(b.offsetHeight));
  }
  return bad;
}
function scanHandlers(){
  var bad=[],btns=document.querySelectorAll("#phone button"),i;
  for(i=0;i<btns.length;i++){
    var b=btns[i];
    if(!b.getAttribute("data-a"))
      bad.push("button with no action: "+JSON.stringify((b.textContent||"").trim().slice(0,40)));
  }
  return bad;
}
function scanExternal(){
  var bad=[],els=document.querySelectorAll("[src],[href]"),i;
  for(i=0;i<els.length;i++){
    var v=els[i].getAttribute("src")||els[i].getAttribute("href")||"";
    if(/^(https?:)?\/\//.test(v)||/^data:image/.test(v))bad.push("external request: "+v.slice(0,60));
  }
  return bad;
}
window.WARD={

};
/* ============================================================
   11. BOOT
   ============================================================ */
var _lastAct=-1,_lastT=0;
var PLANW=0,PLANH=0;
function planFit(){
  var ww=el("wardwrap"),lg=el("legend"),W,H,sc;
  if(!ww)return;
  W=ww.clientWidth-16;
  H=ww.clientHeight-(lg?lg.offsetHeight:0)-30;
  sc=Math.min(W/374,H/452);
  if(!(sc>0.25))sc=0.25;
  if(sc>1.4)sc=1.4;
  apply(sc);
  var ph=el("phone");
  if(ph&&ph.scrollHeight>ph.clientHeight+1){
    var over=ph.scrollHeight-ph.clientHeight;
    sc=Math.max(0.25,(PLANH-over)/452);
    apply(sc);
  }
}
function apply(sc){
  PLANW=Math.round(374*sc);PLANH=Math.round(452*sc);
  el("plan").style.width=PLANW+"px";
  el("plan").style.height=PLANH+"px";
  el("wardart").style.width=PLANW+"px";
  el("wardart").style.height=PLANH+"px";
}
function fit(){
  var st=el("stage"),g=el("ground");
  var w=g.clientWidth,h=g.clientHeight;
  var s=Math.min(1,w/390,h/844);
  st.style.transform="scale("+s+")";
  planFit();
}
addEventListener("resize",function(){fit();});
function frame(t){
  if(!_lastT)_lastT=t;
  var dt=Math.min(0.5,(t-_lastT)/1000);
  _lastT=t;
  tick(dt);
  if(S.acts!==_lastAct||S.dirty){
    _lastAct=S.acts;S.dirty=0;
    var sc=null;
    if(S.sheet){var bd=el(S.sheet).querySelector(".bd");if(bd)sc=bd.scrollTop;}
    render();
    if(sc!==null){var bd2=el(S.sheet).querySelector(".bd");if(bd2)bd2.scrollTop=sc;}
  }
  requestAnimationFrame(frame);
}
function boot(){
  var away=false;
  try{away=load();}catch(e){S=freshWard();}
  if(typeof S.away!=="number")S.away=0;
  if(!S.rooms||S.rooms.length!==6)S.rooms=freshWard().rooms;
  if(!S.staff||!S.staff.length)S.staff=freshWard().staff;
  seedRng((Date.now()%99991)+1);
  if(S.away>0.5)awayTick(S.away);
  el("s-loadfill").style.transform="scaleX(0)";
  document.addEventListener("click",onClick);
  document.addEventListener("keydown",onKey);
  window.addEventListener("resize",fit);
  window.addEventListener("orientationchange",fit);
  if(el("s-queue"))el("s-queue").setAttribute("data-a","door");
  applyScale();
  loadCalc();
  fit();
  render();
  fit();
  setTimeout(fit,140);
  setTimeout(fit,700);
